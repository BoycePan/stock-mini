name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 构建镜像并部署到服务器（scp 直传，不走镜像仓库） ──
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t stock-backend-java:latest ./backend-java

      - name: Save image to tar
        run: docker save stock-backend-java:latest | gzip > stock-backend-java.tar.gz

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Create remote dir
        run: ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p /apps/stock/backend-java"

      - name: Copy image to server
        run: scp stock-backend-java.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/apps/stock/backend-java/

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /apps/stock/backend-java

            # 配置不打包进镜像：服务器上必须有 .env（git 忽略，无法从仓库带过来）
            # 首次部署前手动创建：ssh 到服务器后
            #   mkdir -p /apps/stock/backend-java
            #   把本地 backend-java/.env 内容拷到 /apps/stock/backend-java/.env
            if [ ! -f .env ]; then
              echo ".env 不存在，请先创建 /apps/stock/backend-java/.env（模板见仓库 backend-java/.env.example）" >&2
              exit 1
            fi

            # 加载新镜像
            docker load < stock-backend-java.tar.gz
            rm stock-backend-java.tar.gz

            # 滚动重启
            docker stop stock-backend-java 2>/dev/null || true
            docker rm stock-backend-java 2>/dev/null || true
            docker run -d \
              --name stock-backend-java \
              --restart unless-stopped \
              --network host \
              --env-file .env \
              stock-backend-java:latest

            # 等待健康检查（最多 60s）
            echo "=== 等待启动 ==="
            for i in $(seq 1 60); do
              if curl -fsS http://localhost:18487/api/health >/dev/null 2>&1; then
                echo "就绪 (${i}s)"
                break
              fi
              sleep 1
              [ "$i" -eq 60 ] && { echo "健康检查超时" >&2; false; }
            done

            # 检查容器状态
            echo "=== 容器状态 ==="
            docker ps --filter name=stock-backend-java --format "{{.Status}}"

            echo "=== 健康检查 ==="
            curl -fsS http://localhost:18487/api/health && echo " OK" || {
              echo "FAILED, 最近日志:"
              docker logs --tail 30 stock-backend-java
              exit 1
            }

            # 清理旧镜像
            docker image prune -f
