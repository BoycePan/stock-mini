name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 构建镜像 → 推送到阿里云 ACR → 服务器 docker pull（增量）部署 ──
  # 镜像仓库地址由仓库 Variable ACR_REGISTRY 控制：
  #   公网: crpi-s4cng3rcywy97jox.cn-hangzhou.personal.cr.aliyuncs.com（当前，已确认 ECS 走公网）
  #   内网: crpi-s4cng3rcywy97jox-vpc.cn-hangzhou.personal.cr.aliyuncs.com
  #   （ECS 与 ACR 同为杭州；将来 ACR 控制台开通 VPC 内网访问后，改这个变量即可走内网、不占公网带宽）
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR
        run: echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ vars.ACR_REGISTRY }}" -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build and push image
        run: |
          docker build -t stock-backend-java:latest ./backend-java
          docker tag stock-backend-java:latest "${{ vars.ACR_REGISTRY }}/lilaiyun_guyu/guyu_info:latest"
          docker push "${{ vars.ACR_REGISTRY }}/lilaiyun_guyu/guyu_info:latest"

      - name: Deploy on server
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # 把 ACR 登录信息作为环境变量传给远端脚本（appleboy/ssh-action 的 envs 机制）
          envs: ACR_USERNAME,ACR_PASSWORD
          script: |
            set -e
            REGISTRY="${{ vars.ACR_REGISTRY }}"
            IMAGE="$REGISTRY/lilaiyun_guyu/guyu_info:latest"

            cd /apps/stock/backend-java

            # 配置不打包进镜像：服务器上必须有 .env（git 忽略，无法从仓库带过来）
            if [ ! -f .env ]; then
              echo ".env 不存在，请先创建 /apps/stock/backend-java/.env（模板见仓库 backend-java/.env.example）" >&2
              exit 1
            fi

            # 登录 ACR 并拉取新镜像（增量：只拉变化的层，不再全量 scp）
            echo "$ACR_PASSWORD" | docker login "$REGISTRY" -u "$ACR_USERNAME" --password-stdin
            docker pull "$IMAGE"

            # 日志目录（挂载到 /apps/logs；提前创建，便于后续设置读写权限）
            mkdir -p /apps/stock/backend-java/logs

            # 滚动重启
            docker stop stock-backend-java 2>/dev/null || true
            docker rm stock-backend-java 2>/dev/null || true
            docker run -d \
              --name stock-backend-java \
              --restart unless-stopped \
              --network host \
              -e LOG_DIR=/apps/logs \
              -v /apps/stock/backend-java/logs:/apps/logs \
              --env-file .env \
              "$IMAGE"

            # 等待健康检查（最多 60s）
            echo "=== 等待启动 ==="
            for i in $(seq 1 60); do
              if curl -fsS http://localhost:18487/api/health >/dev/null 2>&1; then
                echo "就绪 (${i}s)"
                break
              fi
              sleep 1
              [ "$i" -eq 60 ] && { echo "健康检查超时" >&2; false; }
            done

            # 检查容器状态
            echo "=== 容器状态 ==="
            docker ps --filter name=stock-backend-java --format "{{.Status}}"

            echo "=== 健康检查 ==="
            curl -fsS http://localhost:18487/api/health && echo " OK" || {
              echo "FAILED, 最近日志:"
              docker logs --tail 30 stock-backend-java
              exit 1
            }

            # 清理旧镜像
            docker image prune -f
