name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── 测试 ──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: go vet
        run: go vet ./...
        working-directory: backend
      - name: go test
        run: go test ./...
        working-directory: backend

  # ── 构建镜像并部署 ──
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t wx-stock-backend:latest ./backend

      - name: Save image to tar
        run: docker save wx-stock-backend:latest | gzip > wx-stock-backend.tar.gz

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy image to server
        run: scp wx-stock-backend.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/apps/stock/backend/

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /apps/stock/backend

            # 加载新镜像
            docker load < wx-stock-backend.tar.gz
            rm wx-stock-backend.tar.gz

            # 滚动重启
            docker stop wx-stock-backend 2>/dev/null || true
            docker rm wx-stock-backend 2>/dev/null || true
            docker run -d \
              --name wx-stock-backend \
              --restart unless-stopped \
              --network host \
              -v /apps/stock/backend/config.yaml:/app/config.yaml:ro \
              wx-stock-backend:latest

            # 等待启动
            sleep 3

            # 检查容器状态
            echo "=== 容器状态 ==="
            docker ps --filter name=wx-stock-backend --format "{{.Status}}"

            # 服务器本地健康检查
            echo "=== 健康检查 ==="
            curl -fsS http://localhost:18487/api/health && echo "OK" || {
              echo "FAILED, 最近日志:"
              docker logs --tail 30 wx-stock-backend
              exit 1
            }

            # 清理旧镜像
            docker image prune -f
