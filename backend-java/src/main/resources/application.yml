# 配置来源：工作目录 .env（spring-dotenv 启动时加载）或真实环境变量，OS 环境变量优先。
# 模板见 .env.example；测试走 application-test.yml，不依赖 .env。
server:
  port: 18487

# 日志落盘目录（logback-spring.xml 读取，按天滚动、保留 3 天）。
# 容器内默认 /apps/logs，由 deploy.sh 挂载宿主目录；本机调试可设 LOG_DIR=logs
logging:
  file:
    path: ${LOG_DIR:/Users/lilaiyun/Downloads/logs}
  level:
    org.springframework.jdbc.core: TRACE

spring:
  application:
    name: stock-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=disable
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      # 每个新连接初始化时钉死会话时区为东8区：保证 now()/CURRENT_TIMESTAMP 及 TIMESTAMPTZ
      # 的显示都是北京时间，与 DAO 用 LocalDateTime.now()（JVM 默认 Asia/Shanghai）写入的
      # 无时区 TIMESTAMP 列口径一致（数据库服务器 timezone 默认可能是 UTC）。
      connection-init-sql: SET timezone TO 'Asia/Shanghai'

app:
  collector:
    auto-full: false
    sample-size: 20
    run-sample-on-start: false
  jwt:
    secret: ${JWT_SECRET}
    expire-hours: ${JWT_EXPIRE_HOURS:24}
  wechat:
    # 登录请求未携带 source 时默认使用的小程序来源（兼容已发布的旧小程序）
    default-source: shiChang-tracker
    # 各小程序来源的 appid/secret（appid 非敏感可直接写死；secret 一律走环境变量）
    apps:
      shiChang-tracker:
        app-id: ${WECHAT_APP_ID}
        app-secret: ${WECHAT_APP_SECRET}
      # 行情追踪（新小程序）；secret 未配置时该 source 登录返回 400，不影响其余小程序
      hangQing-tracker:
        app-id: wx0ecd2049e54fbca8
        app-secret: ${HANGQING_TRACKER_WECHAT_APP_SECRET:}
  sina:
    # 值来自 .env（spring-dotenv）或环境变量；未设置时用默认值兜底
    rate-limit-seconds: ${SINA_RATE_LIMIT:1.0}
    max-retries: ${SINA_MAX_RETRIES:3}
    timeout-seconds: ${SINA_TIMEOUT:30}
    user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
    referer: "https://finance.sina.com.cn"
    # 通用新闻 feed 定时拉取（SinaFeedScheduler，每 5 分钟）。/news/feed 接口只查库，不再实时打新浪。
    feed-enabled: ${SINA_FEED_ENABLED:true}
    feed-keyword: ${SINA_FEED_KEYWORD:A股}
    feed-count: ${SINA_FEED_COUNT:20}
  eastmoney:
    # 对齐 Go config.yaml stock.eastmoney（限流最保守，4s/次，只做按需补充）
    rate-limit-seconds: ${EASTMONEY_RATE_LIMIT:4.0}
    max-retries: ${EASTMONEY_MAX_RETRIES:5}
    timeout-seconds: ${EASTMONEY_TIMEOUT:30}
    user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
    referer: "https://quote.eastmoney.com/"
  cninfo:
    # 对齐 Go config.yaml stock.cninfo（不限流，单线程串行调用）
    rate-limit-seconds: ${CNINFO_RATE_LIMIT:0.0}
    max-retries: ${CNINFO_MAX_RETRIES:1}
    timeout-seconds: ${CNINFO_TIMEOUT:30}
    user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
    referer: "http://www.cninfo.com.cn/"
  ths:
    # 对齐 Go config.yaml stock.ths（TLS 指纹检测风险，默认关闭）
    rate-limit-seconds: ${THS_RATE_LIMIT:0.5}
    max-retries: ${THS_MAX_RETRIES:3}
    timeout-seconds: ${THS_TIMEOUT:30}
    user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
    referer: "https://q.10jqka.com.cn/"
  fetch:
    # 雅虎 Python sidecar（方案 A）。镜像内已内置脚本与依赖，Java 启动自动拉起、退出随之销毁。
    enabled: ${FETCH_ENABLED:true}
    script-path: ${FETCH_SCRIPT_PATH:scripts/fetch_service.py}
    python: ${FETCH_PYTHON:python3}
    host: ${FETCH_HOST:127.0.0.1}
    port: ${FETCH_PORT:8001}
    startup-timeout-seconds: ${FETCH_STARTUP_TIMEOUT:30}
    # 本机开发代理（注入给 Python 侧走雅虎）；生产海外留空=直连。也可只配 FETCH_HTTPS_PROXY。
    https-proxy: ${FETCH_HTTPS_PROXY:}
    http-proxy: ${FETCH_HTTP_PROXY:}
    # Cloudflare Worker 反向代理通道：配了 FETCH_WORKER_BASE/FETCH_AUTH_TOKEN 则 sidecar 走 Worker（无需 Clash）；
    # 留空则用上面的代理或直连（二选一）。
    worker-base: ${FETCH_WORKER_BASE:}
    auth-token: ${FETCH_AUTH_TOKEN:}
    # 每天 6:00 自动拉取全球指数并同步元数据；设 FETCH_AUTO=false 关闭
    auto-fetch: ${FETCH_AUTO:true}
    # 指数/板块/资产快照定时刷新：默认 60s 批量拉最新点位落 quote_snapshot（63+ symbol，30s 会撞雅虎限流）
    snapshot-enabled: ${FETCH_SNAPSHOT_ENABLED:true}
    snapshot-interval-ms: ${FETCH_SNAPSHOT_INTERVAL_MS:60000}
  rss:
    # RSS 新闻定时拉取（RssNewsScheduler，每分钟）。源列表在数据库 rss_source 表（见 scripts/rss_source.sql），
    # 本段只放运行参数与 Worker 凭据。
    enabled: ${RSS_ENABLED:true}
    # 每个源每轮最多取多少条（实际入库因去重通常远少于此）
    max-items-per-feed: ${RSS_MAX_ITEMS:20}
    # Cloudflare Worker 转发通道：配了才能拉 via_worker=true 的源（海外源）。
    # 不配 RSS_WORKER_BASE/RSS_AUTH_TOKEN 时自动沿用 FETCH_*（Yahoo sidecar 同款 Worker，见上方 app.fetch）。
    worker-base: ${RSS_WORKER_BASE:${FETCH_WORKER_BASE:}}
    auth-token: ${RSS_AUTH_TOKEN:${FETCH_AUTH_TOKEN:}}
  logging:
    # 每个 HTTP 请求的耗时日志（方法/URI/状态码/耗时ms/IP/uid），见 RequestLogFilter
    request-enabled: ${REQUEST_LOG_ENABLED:true}
    # 慢请求阈值（毫秒）：>0 时耗时 ≥ 该值的请求升级为 WARN 日志，0 表示全部按 INFO
    slow-request-ms: ${SLOW_REQUEST_MS:0}
  mgr:
    # 管理端接口 /api/mgr/** 拦截鉴权（MgrAuthInterceptor）：false 关闭拦截（调试用）
    auth-enabled: ${MGR_AUTH_ENABLED:true}

    # 管理员登录口令 root@Qwer1234@@（用户名@密码）的 base64
    admin-token: cm9vdEBRd2VyMTIzNEBA
  tracking:
    # 用户行为打点上报（/api/v1/track/events）：false 关闭上报接口
    enabled: ${TRACKING_ENABLED:true}
    # 单批最多接受的事件条数（超出按 400 拒绝）
    max-batch-size: ${TRACKING_MAX_BATCH_SIZE:100}

