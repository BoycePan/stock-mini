# =====================================================================
# p6spy SQL 日志（数据库日志改造：耗时在前 + 参数内联的单行 SQL）
# =====================================================================
# 说明：
# - 本文件放 classpath 根（src/main/resources/spy.properties），应用启动即生效；
# - 输出走 slf4j（logger 名 p6spy），复用 logback-spring.xml 的 CONSOLE + FILE 双通道；
# - 日志级别由 application.yml 的 logging.level.p6spy 控制（默认 INFO）。
#
# 效果示例（JdbcTemplate 执行 UPDATE stock_info SET trading_hours=?, updated_at=? WHERE code=?
# 且参数为 ('09:30-15:00', '2026-08-29 10:00:00', 'AAPL') 时）：
#   耗时=12ms | UPDATE stock_info SET trading_hours='09:30-15:00', updated_at='2026-08-29 10:00:00' WHERE code='AAPL'

# 输出到 slf4j（logger 名 p6spy），由 logback 统一落控制台/文件
appender=com.p6spy.engine.spy.appender.Slf4JLogger

# 单行格式：耗时(ms) 放最前面，SQL 参数已内联（%(sqlSingleLine)）
# 注：\u8017\u65f6 = "耗时"（spy.properties 按 ISO-8859-1 读取，中文用 unicode 转义，日志中正常显示中文）
logMessageFormat=com.p6spy.engine.spy.appender.CustomLineFormat
customLogMessageFormat=\u8017\u65f6=%(executionTime)ms | %(sqlSingleLine)

# 只保留 SQL 语句（statement/batch），过滤 result（逐行读结果集）/commit/rollback 噪音
excludecategories=info,debug,result,resultset,batch,commit,rollback

# 必须打开 filter 才能让 exclude/include 生效（p6spy 默认 filter=false 会忽略 exclude）
filter=true

# 不打印 Hikari 每条新连接的初始化语句（application.yml 的 connection-init-sql）
exclude=SET timezone.*
