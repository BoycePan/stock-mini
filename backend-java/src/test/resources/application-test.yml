spring:
  datasource:
    url: jdbc:h2:mem:health;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      # 覆盖主 application.yml 的 PostgreSQL 语法（SET timezone TO ... H2 不识别）：
      # H2 用 SET TIME ZONE '+08:00' 等价钉死东8区
      connection-init-sql: SET TIME ZONE '+08:00'

# 测试日志落到 target/test-logs，避免写容器/开发机根目录 /apps/logs
logging:
  file:
    path: target/test-logs

# 测试专用配置（非生产值）：让 @SpringBootTest 能完整加载 JwtService/SinaClient bean
app:
  collector:
    # 关闭启动自检：测试库为空会触发真实采集（网络），@SpringBootTest 上下文加载时必须跳过
    startup-check: false
  jwt:
    secret: test-secret-0123456789abcdefghijklmnopqrstuvwxyz
    expire-hours: 24
  wechat:
    app-id: test-appid
    app-secret: test-appsecret
  sina:
    rate-limit-seconds: 1.0
    max-retries: 1
    timeout-seconds: 5
    user-agent: "test-agent"
    referer: "https://test.local"
    # 测试关闭新浪 feed 定时拉取：避免 @SpringBootTest 上下文加载触发真实网络请求
    feed-enabled: false
  eastmoney:
    rate-limit-seconds: 0.0
    max-retries: 1
    timeout-seconds: 5
    user-agent: "test-agent"
    referer: "https://test.local"
  cninfo:
    rate-limit-seconds: 0.0
    max-retries: 1
    timeout-seconds: 5
    user-agent: "test-agent"
    referer: "https://test.local"
  ths:
    rate-limit-seconds: 0.0
    max-retries: 1
    timeout-seconds: 5
    user-agent: "test-agent"
    referer: "https://test.local"
  rss:
    # 测试关闭 RSS 定时拉取：@SpringBootTest 启动时 RssNewsScheduler 会种子+首轮拉取，
    # 避免测试上下文触发真实网络请求。
    enabled: false
  tracking:
    # 测试关闭 click_event 清理：避免 @SpringBootTest 定时任务误删测试数据
    cleanup-enabled: false
  fetch:
    # 测试关闭雅虎 sidecar 拉起：避免 @SpringBootTest 启动时 spawn Python 进程/占端口
    enabled: false
