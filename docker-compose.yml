# ================================================================
#  docker-compose.yml — wx-app-stock 后端
# ================================================================
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wx-app-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./backend/config.yaml:/app/config.yaml:ro
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/v1/stock/search?keyword=test"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
