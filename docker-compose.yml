# ================================================================
#  docker-compose.yml — wx-app-stock 后端
# ================================================================
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOPROXY: "${GOPROXY:-https://goproxy.cn,direct}"
        GOSUMDB: "${GOSUMDB:-sum.golang.google.cn}"
        ALPINE_MIRROR: "${ALPINE_MIRROR:-https://mirrors.aliyun.com/alpine}"
    container_name: wx-app-backend
    restart: unless-stopped
    ports:
      - "18487:18487"
    volumes:
      - ./backend/config.yaml:/app/config.yaml:ro
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:18487/api/v1/stock/search?keyword=test"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
